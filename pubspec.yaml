name: bt_business
description: BT Business — production business accounting application.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local storage (offline-first)
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5

  # macOS / desktop SQLite support
  sqflite_common_ffi: ^2.3.5

  # Future Firebase sync (wired in data/remote/firebase)
  # firebase_core: ^3.13.0
  # cloud_firestore: ^5.6.7
  # firebase_auth: ^5.5.3

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  uuid: ^4.5.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.5
  build_runner: ^2.4.15
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # fonts:
  #   - family: BTBusiness
  #     fonts:
  #       - asset: assets/fonts/BTBusiness-Regular.ttf
